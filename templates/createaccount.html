<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Create account | VeriScan AI</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet"><style>
:root{--bg:#090d16;--panel:rgba(22,30,46,.9);--line:rgba(255,255,255,.1);--text:#f1f5f9;--muted:#94a3b8;--accent:#38bdf8}*{box-sizing:border-box}body{min-height:100vh;margin:0;padding:30px;color:var(--text);background:var(--bg);background-image:radial-gradient(circle at 55% 0%,rgba(56,189,248,.14),transparent 42%);font-family:'Manrope',sans-serif}.auth-page{width:min(430px,100%);margin:55px auto 0}.kicker{margin-bottom:14px;color:var(--accent);font:500 .7rem 'DM Mono',monospace;letter-spacing:.14em;text-transform:uppercase}h1{margin:0;font-size:2.7rem;letter-spacing:-.06em}.lede{margin:15px 0 28px;color:var(--muted);line-height:1.6;font-size:.88rem}.auth-card{padding:27px;border:1px solid var(--line);border-radius:14px;background:linear-gradient(145deg,rgba(255,255,255,.08),rgba(0,0,0,.14));box-shadow:inset 1px 1px 0 rgba(255,255,255,.1),inset -2px -2px 0 rgba(0,0,0,.22),0 20px 38px rgba(0,0,0,.3)}label{display:block;margin:17px 0 8px;color:var(--muted);font-size:.76rem;font-weight:700}input{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:8px;outline:none;color:var(--text);background:rgba(0,0,0,.22);font:.85rem 'Manrope',sans-serif;box-shadow:inset 0 2px 6px rgba(0,0,0,.2)}input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(56,189,248,.18)}button{width:100%;margin-top:23px;padding:13px;border:0;border-radius:8px;color:#07141b;background:var(--accent);font-weight:800;cursor:pointer;box-shadow:inset 0 1px 0 rgba(255,255,255,.45),inset 0 -2px 0 rgba(0,0,0,.2),0 3px 0 rgba(0,0,0,.3)}.error{padding:11px;border-left:3px solid #ff8c8c;color:#ffd2d2;background:rgba(255,80,80,.1);font-size:.78rem;line-height:1.5}.auth-link{margin:20px 0 0;color:var(--muted);text-align:center;font-size:.78rem}.auth-link a{color:var(--accent);font-weight:700}.password-note{margin:9px 0 0;color:var(--muted);font-size:.68rem}@media(max-width:760px){body{padding:24px 16px}.auth-page{margin-top:25px}}
</style></head><body><main class="auth-page"><div class="kicker">VeriScan account / 07</div><h1>Make it yours.</h1><p class="lede">Create a secure account for your telemetry workspace.</p><section class="auth-card"><form method="post">{% if error %}<div class="error" role="alert">{{ error }}</div>{% endif %}<label for="username">Username</label><input id="username" name="username" type="text" required minlength="3" maxlength="30" pattern="[A-Za-z0-9_]+" autocomplete="username"><label for="email">Email address</label><input id="email" name="email" type="email" required maxlength="254" autocomplete="email"><label for="password">Password</label><input id="password" name="password" type="password" required minlength="8" autocomplete="new-password"><p class="password-note">Use at least 8 characters.</p><label for="confirm_password">Confirm password</label><input id="confirm_password" name="confirm_password" type="password" required minlength="8" autocomplete="new-password"><button type="submit">Create account</button></form><p class="auth-link">Already have an account? <a href="{{ url_for('login') }}">Log in</a></p></section></main><script src="/static/sidepanel.js"></script></body></html>
